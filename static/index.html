<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Contract Parser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .table-hover tbody tr:hover { background-color: #f8f9fa; }
        .action-btn { cursor: pointer; color: #dc3545; }
        .action-btn:hover { color: #a71d2a; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Умный парсер договоров (NLP + LLM)</h2>
            <span class="badge bg-success">v2.0 Scalable</span>
        </div>
        
        <!-- Блок загрузки -->
        <div class="card mb-4 shadow-sm border-0">
            <div class="card-body">
                <form id="uploadForm" class="d-flex align-items-center">
                    <input class="form-control me-2" type="file" id="fileInput" accept=".pdf, .docx" required>
                    <button class="btn btn-primary d-flex align-items-center" type="submit" id="submitBtn">
                        <span id="btnText">Загрузить и проанализировать</span>
                        <div id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></div>
                    </button>
                </form>
                
                <!-- Алерты (Уведомления) -->
                <div id="alertBox" class="mt-3 d-none alert" role="alert"></div>
            </div>
        </div>

        <!-- Таблица -->
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h4 class="card-title mb-3">Реестр документов</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Имя файла</th>
                                <th>Номер договора</th>
                                <th>Дата</th>
                                <th>Стороны</th>
                                <th>Сумма</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Данные загружаются через JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        function showAlert(message, type = 'danger') {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `mt-3 alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.classList.remove('d-none');
            setTimeout(() => alertBox.classList.add('d-none'), 5000);
        }

        async function loadDocuments() {
            try {
                const response = await fetch(`${API_BASE}/documents`);
                const data = await response.json();
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Реестр пуст. Загрузите документ для анализа.</td></tr>';
                    return;
                }

                data.forEach(doc => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><code>${doc.id.slice(0, 8)}</code></td>
                        <td><i class="bi bi-file-earmark-text text-primary me-2"></i>${doc.filename}</td>
                        <td class="fw-bold">${doc.number}</td>
                        <td>${doc.date}</td>
                        <td><small>${doc.parties}</small></td>
                        <td><span class="badge bg-secondary">${doc.amount}</span></td>
                        <td>
                            <i class="bi bi-trash action-btn" onclick="deleteDocument('${doc.id}')" title="Удалить"></i>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                showAlert('Ошибка при загрузке реестра.');
            }
        }

        async function deleteDocument(id) {
            if (!confirm('Точно удалить запись?')) return;
            try {
                await fetch(`${API_BASE}/documents/${id}`, { method: 'DELETE' });
                loadDocuments();
            } catch (error) {
                showAlert('Ошибка при удалении.');
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('fileInput');
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            
            if (fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            // UI состояние: Загрузка
            btn.disabled = true;
            btnText.textContent = 'Обработка ИИ...';
            btnSpinner.classList.remove('d-none');

            try {
                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error('Ошибка сервера или неверный формат');
                
                showAlert('Документ успешно проанализирован!', 'success');
                await loadDocuments();
                fileInput.value = ''; 
            } catch (error) {
                showAlert(error.message);
            } finally {
                // UI состояние: Готово
                btn.disabled = false;
                btnText.textContent = 'Загрузить и проанализировать';
                btnSpinner.classList.add('d-none');
            }
        });

        // Инициализация
        loadDocuments();
    </script>
</body>
</html>
